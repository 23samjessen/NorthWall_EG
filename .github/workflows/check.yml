name: NorthWallEg Hostinger production checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: northwall_test_ci
          MYSQL_USER: northwall_ci
          MYSQL_PASSWORD: ci-fixture-only
          MYSQL_ROOT_PASSWORD: ci-root-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare isolated test-only databases
        run: node hostinger/tests/create-ci-databases.mjs
        env:
          NW_CI_DB_PASSWORD: ci-root-fixture-only
      - run: npx tsc --noEmit
      - run: npm run test:backend
      - run: npm run test:news
      - run: npm run test:security
      - run: npm run test:marketing
      - name: Hostinger authentication, recovery and MySQL tests
        run: npm run test:hostinger
        env:
          NW_TEST_DB_NAME: northwall_test_ci
          NW_TEST_DB_USER: northwall_ci
          NW_TEST_DB_PASSWORD: ci-fixture-only
          NW_AUTH_TEST_DB_NAME: northwall_test_auth_ci
          NW_AUTH_TEST_DB_USER: northwall_ci
          NW_AUTH_TEST_DB_PASSWORD: ci-fixture-only
      - run: node scripts/test-sticky-header.mjs
      - run: npm run audit:dependencies
      - name: Build the complete Hostinger Next.js application
        run: npm run build
        env:
          APP_ORIGIN: https://northwallegy.com
          PUBLIC_LAUNCH: 'false'
      - name: Verify the generated standalone server
        run: npm run test:hostinger-render
        env:
          APP_ORIGIN: https://northwallegy.com
          PUBLIC_LAUNCH: 'false'
      - name: Export Hostinger upload package
        run: python3 -B hostinger/package-upload.py --profile nextjs --output "$RUNNER_TEMP/NorthWallEg-Hostinger-Password-Recovery-Google-Reviews.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NorthWallEg-Hostinger-Password-Recovery-Google-Reviews
          path: ${{ runner.temp }}/NorthWallEg-Hostinger-Password-Recovery-Google-Reviews.zip
          if-no-files-found: error
          retention-days: 14
